<!DOCTYPE html>
<html lang="es">
<head>

<body class="bg-dark text-white">

   
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary p-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">← Volver al Inicio</a>

    <main class="container py-5">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold">Contacto y Ubicación</h1>
        <p class="lead text-muted">Ponte en contacto conmigo o visítame directamente.</p>
    </div>

    <div class="row justify-content-center align-items-center g-4">
        <div class="col-12 col-md-6">
            <div class="card bg-secondary text-white p-3 h-100 shadow">
                <h3 class="h4 mb-3 text-center">Mi Ubicación</h3>
                <div class="ratio ratio-16x9">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d34140.565661950786!2d-101.61368874141385!3d17.651423600340777!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x84347718256ac593%3A0xa9fcc95e9e97d187!2sPark%20Royal%20Beach%20Ixtapa!5e0!3m2!1ses!2smx!4v1792987293411!5m2!1ses!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 text-center">
            <div class="card bg-secondary text-white p-4 h-100 shadow d-flex flex-column justify-content-center align-items-center">
                <h3 class="h4 mb-3">¿Tienes alguna duda?</h3>
                <p class="mb-4 text-light">Haz clic abajo para mandarme un mensaje directo a mi WhatsApp en cualquier momento.</p>
                
                <a href="https://wa.me" target="_blank" class="btn btn-success btn-lg px-4 fs-5 fw-bold shadow-sm">
                    Enviar Mensaje por WhatsApp
                </a>
            </div>
        </div>
    </div>
</main>

 <section class="contenedor" id="menu_contact">

    <article id="glass">
        <h2 class="titulo">Registrarse</h2>
        <for action="">
            <input type="text" placeholder="Nombre de Usuario">
            <input type="text" placeholder="Numero de Telefono">
            <input type="text" placeholder="Correo Electronico">
            
            <input type="submit" class="boton" value="Guardar">
        </form>
        </article>




    <script src="js/bootstrap.bundle.min.js"></script>
